[pytest]
# Auto-detect `async def test_*` functions without explicit @pytest.mark.asyncio
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Quiet down SQLAlchemy echo noise from tests (database.py reads DEBUG env)
filterwarnings =
    ignore::DeprecationWarning
markers =
    smoke: tightly-scoped tests covering a single behavior
    security: IDOR / ownership / authz tests
