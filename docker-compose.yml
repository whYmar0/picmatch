version: "3.9"

# ─── Pickmatch Docker Compose ─────────────────────────────────────────────────
# Runs the full stack locally: PostgreSQL + FastAPI backend + React frontend
# Запускает весь стек локально: PostgreSQL + FastAPI бэкенд + React фронтенд
#
# Usage / Использование:
#   docker compose up --build
#   Open http://localhost:5173
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL Database ────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pickmatch
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/pickmatch
      SECRET_KEY: local-dev-secret-32-chars-pickmatch
      BASE_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:5173
      UPLOAD_DIR: /app/uploads
      DEBUG: "true"
    volumes:
      - ./backend:/app
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # ── React Frontend ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000/api
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
